<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>دنیای میویی 🐱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a2c7a; --pink:#ff8fc0; --pink-d:#d4568f; --mint:#6fe0b8; --mint-d:#2fa985;
  --card:rgba(255,255,255,.88);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;background:#9fd8ff;overflow:hidden;color:var(--ink);
  font-family:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
#stage{
  position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:min(100vw,520px);height:100vh;height:100dvh;overflow:hidden;background:#9fd8ff;
}
canvas{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%}

/* ---------- HUD ---------- */
#hud{
  position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;
}
#hud.hidden{visibility:hidden}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.78);color:var(--ink);font-weight:900;font-size:16px;
  box-shadow:0 3px 0 rgba(120,70,170,.22);white-space:nowrap;
}
#lives{justify-self:start;font-size:17px;letter-spacing:1px}
#lives i{font-style:normal;transition:opacity .2s}
#scorePill{justify-self:center;font-size:26px;padding:4px 20px}
.tools{display:flex;gap:6px;justify-self:end;align-items:center;pointer-events:none}
.icon{
  pointer-events:auto;appearance:none;border:0;cursor:pointer;width:38px;height:38px;border-radius:50%;
  font-size:16px;background:rgba(255,255,255,.78);box-shadow:0 3px 0 rgba(120,70,170,.22);
}
#banner{
  position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:6;
  text-align:center;pointer-events:none;font-weight:900;font-size:26px;color:#fff;
  text-shadow:0 2px 0 #ff9ccc,0 4px 0 #b787ff,0 8px 18px rgba(80,30,120,.35);
  opacity:0;transform:scale(.7);transition:opacity .3s,transform .5s cubic-bezier(.2,1.6,.4,1);
}
#banner.show{opacity:1;transform:scale(1)}

/* ---------- screens ---------- */
.screen{
  position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 18px);
  text-align:center;
}
.screen.on{display:flex}
.menu{justify-content:space-between}
.center{justify-content:center;gap:14px;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
h1{
  margin:0;font-size:clamp(50px,16.5vw,82px);font-weight:900;line-height:1.2;color:#fff;
  text-shadow:0 2px 0 #ff9ccc,0 5px 0 #ff9ccc,0 8px 0 #b787ff,0 11px 0 #b787ff,0 20px 30px rgba(80,30,120,.35);
}
.sub{margin:10px 0 0;font-size:18px;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(120,70,170,.45)}
h2{margin:0;font-size:30px;font-weight:900;text-shadow:0 2px 0 #fff}
.card{
  width:100%;max-width:380px;background:var(--card);border-radius:26px;padding:16px 16px 18px;
  box-shadow:0 6px 0 rgba(120,70,170,.2),0 20px 40px rgba(80,30,120,.2);
  display:flex;flex-direction:column;gap:12px;align-items:center;
}
.how{list-style:none;margin:0;padding:0;font-size:14.5px;font-weight:700;line-height:1.95;text-align:right;width:100%}
.how li{display:flex;gap:10px;align-items:flex-start}
.how b{flex:none;width:26px;text-align:center}
.btn{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;font-size:22px;color:#fff;
  padding:12px 40px;border-radius:999px;background:var(--pink);
  box-shadow:0 6px 0 var(--pink-d),0 14px 24px rgba(212,86,143,.35);
  text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pink-d),0 4px 10px rgba(212,86,143,.3)}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-d),0 14px 24px rgba(47,169,133,.3)}
.btn.mint:active{box-shadow:0 1px 0 var(--mint-d),0 4px 10px rgba(47,169,133,.3)}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 5px 0 rgba(120,70,170,.25);font-size:17px;padding:9px 26px}
.btn.ghost:active{box-shadow:0 1px 0 rgba(120,70,170,.25)}
.btn:focus-visible,.icon:focus-visible,.tab:focus-visible,.opt:focus-visible,.sw:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.bigface{font-size:60px;line-height:1}
.bignum{font-size:60px;font-weight:900;line-height:1;color:var(--ink)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats .pill{font-size:15px;box-shadow:0 3px 0 rgba(120,70,170,.18);background:#fff}
.msg{margin:0;font-size:16.5px;font-weight:700;line-height:1.9}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- customize ---------- */
#cust{justify-content:flex-start;gap:10px;background:linear-gradient(180deg,rgba(255,238,248,.95),rgba(232,244,255,.96))}
.pvwrap{position:relative;width:100%;max-width:380px;height:188px;flex:none;border-radius:26px;overflow:hidden;
  background:linear-gradient(#cfeaff,#ffe7f3);box-shadow:inset 0 0 0 3px #fff,0 6px 0 rgba(120,70,170,.2)}
#pv{width:100%;height:100%}
.dice{position:absolute;top:10px;left:10px}
.tabs{display:flex;gap:6px;width:100%;max-width:380px;flex:none}
.tab{flex:1;appearance:none;border:0;font:inherit;font-weight:900;font-size:13.5px;padding:8px 0;border-radius:14px;
  background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(120,70,170,.2);cursor:pointer}
.tab.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
.panel{flex:1;min-height:0;width:100%;max-width:380px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:rgba(255,255,255,.82);border-radius:22px;padding:6px 12px 14px;box-shadow:0 5px 0 rgba(120,70,170,.15);text-align:right}
.panel h3{margin:12px 0 8px;font-size:14px;font-weight:900;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.opt{appearance:none;border:0;font:inherit;cursor:pointer;background:#fff;border-radius:16px;padding:6px 2px 5px;
  box-shadow:0 3px 0 rgba(120,70,170,.18);display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;color:var(--ink);outline:3px solid transparent;line-height:1.35}
.opt.on{outline-color:var(--pink);background:#fff0f7}
.opt canvas{width:56px;height:56px}
.opt .thumb{width:calc(100% - 8px);height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.swrow{display:flex;flex-wrap:wrap;gap:8px}
.sw{appearance:none;border:0;width:36px;height:36px;border-radius:50%;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.15),inset 0 0 0 3px rgba(255,255,255,.75);outline:3px solid transparent}
.sw.on{outline-color:var(--ink)}
@media (prefers-reduced-motion:reduce){ #banner{transition:opacity .3s;transform:none} #banner.show{transform:none} }
</style>
</head>
<body>
<noscript>برای بازی کردن جاوااسکریپت باید روشن باشه.</noscript>

<div id="stage">
  <canvas id="cv"></canvas>

  <header id="hud" class="hidden">
    <div class="pill" id="lives" aria-label="جان‌ها"></div>
    <div class="pill" id="scorePill"><b id="score">۰</b></div>
    <div class="tools">
      <div class="pill" id="starsPill">⭐ <span id="stars">۰</span></div>
      <button id="snd" class="icon" aria-label="صدا">🔊</button>
      <button id="pauseBtn" class="icon" aria-label="توقف">⏸</button>
    </div>
  </header>
  <div id="banner" aria-live="polite"></div>

  <section id="menu" class="screen menu on">
    <div>
      <h1>دنیای میویی</h1>
      <p class="sub">بپر روی ابرای آب‌نباتی ☁️</p>
    </div>
    <div class="card">
      <ul class="how">
        <li><b>👆</b><span>انگشتت رو بکش تا میویی چپ و راست بره</span></li>
        <li><b>☝️</b><span>بزن روی صفحه تا بپره بالا؛ توی هوا هم یه بار دیگه می‌تونی بزنی</span></li>
        <li><b>⭐</b><span>ستاره جمع کن، 🌈 سرعت می‌ده و نمی‌ذاره بیفتی، 🧁 یه پنجه‌ی اضافه می‌ده</span></li>
      </ul>
      <button class="btn" id="playBtn">بزن بریم!</button>
      <button class="btn ghost" id="custBtn">🎨 شخصی‌سازی میویی و دنیا</button>
    </div>
  </section>

  <section id="cust" class="screen">
    <div class="pvwrap">
      <canvas id="pv"></canvas>
      <button class="icon dice" id="rndBtn" aria-label="تصادفی">🎲</button>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="color">🎨 رنگ</button>
      <button class="tab" data-tab="hat">🎩 کلاه</button>
      <button class="tab" data-tab="outfit">👕 لباس</button>
      <button class="tab" data-tab="map">🗺️ دنیا</button>
    </div>
    <div class="panel" id="panel"></div>
    <button class="btn mint" id="custDone">تموم شد ✓</button>
  </section>

  <section id="pause" class="screen center">
    <h2>یه استراحت کوچولو ☕</h2>
    <button class="btn mint" id="resumeBtn">ادامه بدیم</button>
  </section>

  <section id="over" class="screen center">
    <div class="card">
      <div class="bigface" aria-hidden="true">😿</div>
      <h2>اوه نه! میویی افتاد</h2>
      <div class="bignum" id="overScore">۰</div>
      <div class="stats">
        <span class="pill" id="overDist"></span>
        <span class="pill" id="overStars"></span>
        <span class="pill" id="overBest"></span>
      </div>
      <p class="msg" id="overMsg"></p>
      <div class="row">
        <button class="btn" id="again">یه بار دیگه!</button>
        <button class="btn ghost" id="custBtn2">🎨 شخصی‌سازی</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

/* =====================================================
   تنظیمات ساده (اگه خواستی عوضشون کن)
   ===================================================== */
const CONFIG = {
  startSpeed: 4.2,      // سرعت اول بازی (ردیف در ثانیه)
  speedGain: 0.0075,    // سرعت گرفتن به ازای هر ردیف؛ کمترش کنی آروم‌تر زیاد می‌شه
  maxSpeed: 11,         // بیشترین سرعت
  rescueFlutter: true,  // اگه میویی داره می‌افته و هنوز پرش دوم (بال‌زدن) مونده، خودش یه بار بال می‌زنه
  overMessages: [
    'ایرادی نداره، میویی دوباره می‌پره! 🌟',
    'یه بار دیگه؟ این بار حتماً از اون گپ رد می‌شی!',
    'نزدیک بود! ابرا هنوز منتظرتن ☁️',
    'میویی می‌گه: «من هنوز آماده‌ام!» 🐾',
    'یه نفس عمیق و دوباره شروع کن 💪',
  ],
};
/* ===================================================== */

const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#cv');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const fa = n => Math.round(n).toLocaleString('fa-IR');
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const css = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const WHITE = [255, 255, 255], BLACK = [0, 0, 0];
const light = (c, t) => mix(c, WHITE, t), dark = (c, t) => mix(c, BLACK, t);
const hash = (a, b = 0) => {
  let h = (a * 374761393 + b * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

/* =====================================================
   دنیاها (نقشه‌ها)
   ===================================================== */
const WORLD_LEN = 100;
const WORLDS = [
  { name: 'آسمون آب‌نباتی', icon: '🍬', sky: ['#7cc7ff', '#bfe9ff', '#ffe4f1'], a: '#ffc4de', b: '#fff1f8', side: '#ff8fc0',
    dots: ['#ff7eb6', '#7fd8ff', '#ffe36e'], jelly: '#7be3c4', night: 0, sun: '#fff2a8' },
  { name: 'صبح نعنایی', icon: '🌿', sky: ['#79e0c7', '#c7f7e6', '#fff6d6'], a: '#b9f2d8', b: '#f1fff8', side: '#5fd3a8',
    dots: ['#ff9ec2', '#ffffff', '#9ad0ff'], jelly: '#ff9ec2', night: 0, sun: '#fff7c2' },
  { name: 'غروب هلویی', icon: '🍑', sky: ['#ff9a8b', '#ffc6a0', '#ffe9b8'], a: '#ffd0b0', b: '#fff1e2', side: '#ff9a76',
    dots: ['#ff6f91', '#ffffff', '#a58bff'], jelly: '#b9a2ff', night: 0, sun: '#ffe08a' },
  { name: 'شب بنفش', icon: '✨', sky: ['#2a1f5e', '#5b3f9e', '#c88bd9'], a: '#c9b6ff', b: '#ece4ff', side: '#8e74e6',
    dots: ['#ffe27a', '#8fe8ff', '#ff9bd0'], jelly: '#ffd36e', night: 1, sun: '#fff6d0' },
  { name: 'دنیای بستنی', icon: '🍦', sky: ['#ffc2dc', '#ffe3ee', '#fff4dc'], a: '#ffb3d1', b: '#ffeccd', side: '#b9794b',
    dots: ['#8b4a2b', '#ffffff', '#ff7aa8'], jelly: '#9cf0e0', night: 0, sun: '#ffd9a0', weather: 'sprinkle' },
  { name: 'زمستون برفی', icon: '❄️', sky: ['#9bbcf5', '#d3e5ff', '#f4f9ff'], a: '#e3f1ff', b: '#ffffff', side: '#9cc7f2',
    dots: ['#ffffff', '#9fd0ff', '#c7b8ff'], jelly: '#ffb3d1', night: 0, sun: '#fffbe6', weather: 'snow' },
  { name: 'ساحل رویایی', icon: '🏖️', sky: ['#4fc3f7', '#a7e6ff', '#fff3c9'], a: '#ffe8b0', b: '#fff8e1', side: '#f2b25e',
    dots: ['#ff7a7a', '#ffffff', '#6fd3ff'], jelly: '#ff8f8f', night: 0, sun: '#fff2a0', weather: 'bubbles' },
  { name: 'فضای ستاره‌ای', icon: '🚀', sky: ['#0b0a2a', '#2a1c68', '#6a43a8'], a: '#7a66e0', b: '#b2a6ff', side: '#3e2f9e',
    dots: ['#ffd36e', '#7fe8ff', '#ff8fd0'], jelly: '#7fe8ff', night: 1, sun: '#ffe9b0', planet: true },
].map(w => ({ name: w.name, icon: w.icon, sky: w.sky.map(hex), skyHex: w.sky, a: hex(w.a), b: hex(w.b), side: hex(w.side), aHex: w.a, sideHex: w.side,
  dots: w.dots.map(hex), jelly: hex(w.jelly), night: w.night, sun: hex(w.sun), weather: w.weather || null, planet: !!w.planet }));

/* =====================================================
   شخصی‌سازی میویی
   ===================================================== */
const FURS = [
  { n: 'صورتی شیرین', hi: '#ffffff', mid: '#fff3f8', lo: '#ffc6de', inner: '#ffb3d1', line: 'rgba(255,150,190,.55)', ink: '#4a2c5e', pat: 'rgba(200,110,160,.30)' },
  { n: 'سفید برفی',   hi: '#ffffff', mid: '#f6f8ff', lo: '#d6def5', inner: '#ffc0d4', line: 'rgba(150,170,220,.5)',  ink: '#4a2c5e', pat: 'rgba(120,130,190,.28)' },
  { n: 'زنجبیلی',     hi: '#ffd9a8', mid: '#ffb35e', lo: '#e8873a', inner: '#ffd1c0', line: 'rgba(200,110,40,.5)',   ink: '#4a2c5e', pat: 'rgba(160,70,20,.35)' },
  { n: 'ابری',        hi: '#f6f6fb', mid: '#c9ccd8', lo: '#9ea3b8', inner: '#ffc0d4', line: 'rgba(110,115,140,.5)',  ink: '#3a3350', pat: 'rgba(70,75,100,.28)' },
  { n: 'شب',          hi: '#76728f', mid: '#403d57', lo: '#262336', inner: '#ff9ec2', line: 'rgba(255,255,255,.2)',  ink: '#fff3d6', pat: 'rgba(255,255,255,.16)', darkFur: true },
  { n: 'آسمونی',      hi: '#f4fcff', mid: '#bfe6ff', lo: '#8ccaf5', inner: '#ffc6de', line: 'rgba(90,150,210,.5)',   ink: '#3a3560', pat: 'rgba(60,110,180,.28)' },
  { n: 'لیلاکی',      hi: '#fcf7ff', mid: '#e3d2ff', lo: '#b997ee', inner: '#ffc6de', line: 'rgba(150,110,210,.5)',  ink: '#4a2c5e', pat: 'rgba(110,70,180,.28)' },
  { n: 'نعنایی',      hi: '#f4fff9', mid: '#c4f2de', lo: '#8fdcbc', inner: '#ffc6de', line: 'rgba(80,170,140,.5)',   ink: '#2f4a50', pat: 'rgba(40,130,100,.28)' },
  { n: 'لیمویی',      hi: '#fffbe0', mid: '#ffe98f', lo: '#f6c94a', inner: '#ffc0b0', line: 'rgba(210,160,30,.5)',   ink: '#5a3a1e', pat: 'rgba(190,120,20,.3)' },
  { n: 'رنگین‌کمون',  rainbow: true, inner: '#ffb3d1', line: 'rgba(255,255,255,.6)', ink: '#4a2c5e', pat: 'rgba(110,70,160,.25)' },
];
function furNow(i, t) {
  const f = FURS[i];
  if (!f.rainbow) return f;
  const h = (t * 55) % 360;
  return { hi: `hsl(${h},100%,96%)`, mid: `hsl(${h},95%,88%)`, lo: `hsl(${(h + 40) % 360},85%,74%)`, inner: f.inner, line: f.line, ink: f.ink, pat: f.pat };
}
const PATS = ['ساده', 'راه‌راه', 'خال‌خالی', 'شکم‌سفید'];
const ACC = [
  { n: 'صورتی', c: '#ff7eb6' }, { n: 'قرمز', c: '#ff5a6e' }, { n: 'نارنجی', c: '#ffa24d' }, { n: 'زرد', c: '#ffd84d' },
  { n: 'سبز', c: '#7bd96b' }, { n: 'نعنایی', c: '#5fd9b8' }, { n: 'آبی', c: '#5aa9ff' }, { n: 'بنفش', c: '#a98bff' },
  { n: 'سفید', c: '#ffffff' }, { n: 'مشکی', c: '#3a3248' },
].map(a => ({ n: a.n, hex: a.c, c: hex(a.c) }));
const HATS = ['بدون کلاه', 'پاپیون', 'تاج', 'کلاه بافتنی', 'کلاه جادوگر', 'کلاه تولد', 'تاج گل', 'هدفون', 'کلاه حصیری'];
const OUTFITS = ['بدون لباس', 'شال‌گردن', 'پاپیون', 'پلیور', 'تنوره', 'شنل', 'سرهمی', 'بال پری'];

const DEFAULT_LOOK = { fur: 0, pat: 0, hat: 1, hatC: 0, outfit: 0, outC: 6, map: -1 };
let cust = Object.assign({}, DEFAULT_LOOK);
try { Object.assign(cust, JSON.parse(store.get('meowee_look', '{}'))); } catch (e) {}
const saveLook = () => store.set('meowee_look', JSON.stringify(cust));

const emptyRow = () => new Uint8Array(7);

function ensureRows(n) { while (rows.length < n) genSegment(); }

    return;
  }
  const d = Math.min(1, i0 / 1100);

  if (!gen.lastGap && Math.random() < .45 + .3 * d) {

  let pc = clamp(gen.pc + rnd(-1.6, 1.6) * (1 + d * .4), w / 2, 7 - w / 2);
  const arc = gap >= 2 && Math.random() < .75;
  const arcCol = clamp(Math.floor(pc), 0, 6);
  for (let g = 0; g < gap; g++) {
    const its = [];
    if (arc) its.push({ c: arcCol, type: 'star', h: .8 + Math.sin((g + 1) / (gap + 1) * Math.PI) * 1.2, got: false, ph: rnd(0, 6) });
    pushRow(emptyRow(), its);

  for (let k = 0; k < len; k++) {
    pc = clamp(pc + rnd(-.3, .3), w / 2, 7 - w / 2);
    const s0 = clamp(Math.round(pc - w / 2), 0, 7 - w);
    const cells = emptyRow();
    for (let j = s0; j < s0 + w; j++) cells[j] = 1;
    const its = [];
    if (w >= 3 && Math.random() < d * .05) cells[s0 + 1 + Math.floor(Math.random() * (w - 2))] = 0;
    if (i0 > 40 && k >= 2 && k < len - 1 && gen.obsCool <= 0 && Math.random() < .07 + .1 * d) {
      const j = s0 + Math.floor(Math.random() * w);
      if (cells[j] === 1) { cells[j] = 2; gen.obsCool = 3; }

    gen.obsCool--;

      if (k === 1) sCol = s0 + Math.floor(Math.random() * w);
      if (cells[sCol] === 1) its.push({ c: sCol, type: 'star', h: .75, got: false, ph: rnd(0, 6) });

const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];
const sfx = {

  flutter() { tone(520, .16, 'triangle', .07, 520); },

  big() { [0, 2, 4, 6].forEach(i => tone(PENTA[i], .2, 'triangle', .08, 0, i * .035)); },
  life() { [0, 2, 4, 5].forEach(i => tone(PENTA[i], .24, 'sine', .09, 0, i * .07)); },
  dash() { tone(220, .5, 'sawtooth', .04, 900); [0, 2, 4, 6, 7].forEach(i => tone(PENTA[i], .2, 'triangle', .06, 0, i * .05)); },

function addPart(kind, x, y, n, color) {

/* ---------- gameplay ---------- */

}

}
function pauseGame() { if (st !== 'play') return; st = 'paused'; screen('pause'); }

function respawn() {

    ensureRows(r + 6);
    const row = rows[r];
    const cnt = row.reduce((a, v) => a + (v === 1 ? 1 : 0), 0);
    if (cnt >= 3 && !row.includes(2) && !rows[r + 1].includes(2)) break;
    r++;
  }
  const cols = []; rows[r].forEach((v, i) => { if (v) cols.push(i - 3); });
  P.z = r + .5; P.x = steer = cols.reduce((a, b) => a + b, 0) / cols.length;
  P.y = 2.4; P.vy = 0; P.flut = 1; P.inv = 2; P.dash = 0; trail = [];
  camX = P.x;
}
function hurt(why) {

  shake = REDUCED ? 0 : .4; flash = .45; P.hurtT = .7; P.inv = Math.max(P.inv, 1.7);
  const [sx, sy] = screenOf(P.x, P.y + PLAYER_R, P.z);
  addPart('puff', sx, sy, 8, '#ffffff');
  popText(sx, sy - 40, why === 'fall' ? 'ووپس! 🫧' : 'بونک! 💫', '#fff');
  buzz(90); updateHud();

function collect(it, r) {

    comboT = 1.5; combo++;

    addPart('spark', sx, sy, it.type === 'big' ? 18 : 9, it.type === 'big' ? '#ff9ed2' : '#ffe27a');

/* ---------- update ---------- */
function update(dt) {

  const ph = Math.abs(Math.sin(t * 3.2));
  const air = ph * R * 1.1;
  ctx.globalAlpha = .25; ell(pvW / 2, base + R * .3, R * (1 - ph * .3), R * .28 * (1 - ph * .3), '#3b1f5e'); ctx.globalAlpha = 1;
  const sq = ph < .12 ? (.12 - ph) * 1.6 : 0;
  ctx.save(); ctx.translate(pvW / 2, base - R * .62 - air); ctx.scale(1 + sq, 1 - sq);
  drawMeowee(R, { t, blink: (t % 3.2) < .12, hurt: false, dash: false, open: ph > .6, air: ph > .15, stretch: ph > .3 ? .05 : 0 });
  ctx.restore();
  ctx = mainCtx;
}
function drawIcon(canvas, over) {
  const d = Math.min(window.devicePixelRatio || 1, 2), S = 72;
  canvas.width = canvas.height = Math.round(S * d);
  const c = canvas.getContext('2d'); ctx = c;
  c.setTransform(d, 0, 0, d, 0, 0);
  const look = Object.assign({}, cust, over);
  c.save(); c.translate(S / 2, S * .66); drawMeowee(S * .245, { t: 1.3, blink: false, hurt: false, dash: false, open: false, air: false, stretch: 0 }, look); c.restore();
  ctx = mainCtx;
}
function mk(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function swatchRow(key) {
  const row = mk('div', 'swrow');
  ACC.forEach((a, i) => {
    const b = mk('button', 'sw' + (cust[key] === i ? ' on' : '')); b.style.background = a.hex; b.setAttribute('aria-label', a.n);
    b.onclick = () => { cust[key] = i; saveLook(); sfx.pick(); buildPanel(); };
    row.append(b);
  });
  return row;
}
function optGrid(names, key, extra) {
  const g = mk('div', 'grid');
  names.forEach((n, i) => {
    const b = mk('button', 'opt' + (cust[key] === i ? ' on' : ''));
    const c = document.createElement('canvas'); b.append(c); b.append(document.createTextNode(n));
    drawIcon(c, Object.assign({ [key]: i }, extra && extra(i)));
    b.onclick = () => { cust[key] = i; saveLook(); sfx.pick(); buildPanel(); };
    g.append(b);
  });
  return g;
}
function buildPanel() {
  panel.innerHTML = '';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'color') {
    panel.append(mk('h3', null, 'رنگ بدن'));
    const row = mk('div', 'swrow');
    FURS.forEach((f, i) => {
      const b = mk('button', 'sw' + (cust.fur === i ? ' on' : ''));
      b.style.background = f.rainbow ? 'conic-gradient(#ff8fa3,#ffd36e,#9be37d,#7fd8ff,#c39bff,#ff8fa3)' : `linear-gradient(135deg,${f.hi},${f.mid} 45%,${f.lo})`;
      b.setAttribute('aria-label', f.n);
      b.onclick = () => { cust.fur = i; saveLook(); sfx.pick(); buildPanel(); };
      row.append(b);
    });
    panel.append(row);
    panel.append(mk('h3', null, 'الگوی خز'));
    panel.append(optGrid(PATS, 'pat'));
  } else if (tab === 'hat') {
    panel.append(mk('h3', null, 'کلاه'));
    panel.append(optGrid(HATS, 'hat'));
    if (cust.hat) { panel.append(mk('h3', null, 'رنگ کلاه')); panel.append(swatchRow('hatC')); }
  } else if (tab === 'outfit') {
    panel.append(mk('h3', null, 'لباس'));
    panel.append(optGrid(OUTFITS, 'outfit'));
    if (cust.outfit) { panel.append(mk('h3', null, 'رنگ لباس')); panel.append(swatchRow('outC')); }
  } else {
    panel.append(mk('h3', null, 'دنیای بازی؛ یکی رو انتخاب کن یا بذار خودکار عوض بشه'));
    const g = mk('div', 'grid c3');
    const addMap = (i, name, icon, bg) => {
      const b = mk('button', 'opt' + (cust.map === i ? ' on' : ''));
      const th = mk('div', 'thumb', icon); th.style.background = bg; b.append(th); b.append(document.createTextNode(name));
      b.onclick = () => { cust.map = i; saveLook(); sfx.pick(); buildPanel(); };
      g.append(b);
    };
    addMap(-1, 'ترکیبی (خودکار)', '🔀', 'linear-gradient(135deg,#7cc7ff,#ffc6a0,#c88bd9)');
    WORLDS.forEach((w, i) => addMap(i, w.name, w.icon, `linear-gradient(180deg,${w.skyHex[0]},${w.skyHex[1]} 60%,${w.aHex})`));
    panel.append(g);
  }
}
function openCustom() {
  st = 'custom'; screen('cust'); sfx.tap();
  sizePreview(); buildPanel();
}
function closeCustom() { st = 'menu'; screen('menu'); sfx.tap(); }
function randomLook() {
  const pick = n => Math.floor(Math.random() * n);
  Object.assign(cust, { fur: pick(FURS.length), pat: pick(PATS.length), hat: pick(HATS.length), hatC: pick(ACC.length), outfit: pick(OUTFITS.length), outC: pick(ACC.length) });
  saveLook(); sfx.pick(); buildPanel();
}

/* ---------- loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); draw();
  if (st === 'custom') drawPreview();
  requestAnimationFrame(loop);
}

/* ---------- input ---------- */
const ptrs = new Map();
stage.addEventListener('pointerdown', e => {
  if (st !== 'play' || e.target.closest('button')) return;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size > 0) jump();
  ptrs.set(e.pointerId, { x: e.clientX, t: performance.now(), moved: 0 });
});
stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p || st !== 'play') return;
  const dx = e.clientX - p.x; p.x = e.clientX; p.moved += Math.abs(dx);
  steer = clamp(steer + dx * (9 / W), -3.4, 3.4);
});
const release = e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  if (st === 'play' && e.type === 'pointerup' && p.moved < 14 && performance.now() - p.t < 330) jump();
};
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keyDir = -1;
  else if (e.key === 'ArrowRight' || e.key === 'd') keyDir = 1;
  else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { if (st === 'menu' || st === 'over') { e.preventDefault(); startGame(); } else if (st === 'play') { e.preventDefault(); jump(); } }
  else if (e.key === 'p' || e.key === 'Escape') { st === 'play' ? pauseGame() : resumeGame(); }
});
window.addEventListener('keyup', e => {
  if (['ArrowLeft', 'a'].includes(e.key) && keyDir === -1) keyDir = 0;
  if (['ArrowRight', 'd'].includes(e.key) && keyDir === 1) keyDir = 0;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

$('#playBtn').onclick = startGame;
$('#again').onclick = startGame;
$('#custBtn').onclick = openCustom;
$('#custBtn2').onclick = () => { st = 'menu'; resetPlayer(); hudKey = ''; openCustom(); };
$('#custDone').onclick = closeCustom;
$('#rndBtn').onclick = randomLook;
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; tab = b.dataset.tab; sfx.tap(); buildPanel(); panel.scrollTop = 0; });
$('#pauseBtn').onclick = pauseGame;
$('#resumeBtn').onclick = resumeGame;
el.snd.onclick = () => {
  muted = !muted; store.set('meowee_mute', muted ? '1' : '0'); setMuteIcon();
  if (muted) musicStop(); else { sfx.tap(); if (st === 'play') musicStart(); }
};

/* ---------- init ---------- */
setMuteIcon();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
seedScenery(); resize(); resetWorld(); resetPlayer(); updateHud();
requestAnimationFrame(loop);
})();
</script>
</body>
